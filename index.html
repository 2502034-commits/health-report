<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>আমার স্বাস্থ্য রিপোর্ট</title>
<style>
body{font-family:sans-serif;background:#f0f4f8;margin:0;padding:0 0 80px}
header{background:#2b6cb0;color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:12px}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
h2{font-size:16px;color:#2b6cb0;margin:0 0 10px}
input,select,textarea,button{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e0;border-radius:8px;font-size:15px}
button{background:#2b6cb0;color:#fff;border:none;font-weight:bold}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e2e8f0}
.tabbar button{flex:1;background:#fff;color:#4a5568;border-radius:0;margin:0;padding:14px 4px;font-size:12px}
.tabbar button.active{color:#2b6cb0;border-top:3px solid #2b6cb0}
.rec{background:#f7fafc;border-left:4px solid #2b6cb0;padding:10px;border-radius:6px;margin-bottom:8px}
.rec b{color:#2b6cb0}
.hidden{display:none}
.notice{background:#fefcbf;padding:10px;border-radius:6px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<header>
<h1>🩺 আমার স্বাস্থ্য রিপোর্ট</h1>
<p>প্রথম সংস্করণ</p>
</header>
<div class="container">
<div class="notice">⚠️ এই অ্যাপ রোগনির্ণয়ের বিকল্প নয়।</div>

<div id="tab-profile">
<div class="card">
<h2>👤 প্রোফাইল</h2>
<input id="p-name" placeholder="আপনার নাম">
<input id="p-phone" placeholder="ফোন নম্বর">
<input id="p-age" placeholder="বয়স">
<select id="p-gender">
<option value="">লিঙ্গ</option>
<option>পুরুষ</option>
<option>মহিলা</option>
<option>অন্যান্য</option>
</select>
<button onclick="saveProfile()">সংরক্ষণ</button>
<p id="status"></p>
</div>
</div>

<div id="tab-records" class="hidden">
<div class="card">
<h2>➕ নতুন রেকর্ড</h2>
<select id="r-type">
<option>প্রেসক্রিপশন</option>
<option>পরীক্ষার রিপোর্ট</option>
<option>ছাড়পত্র</option>
<option>টিকা</option>
<option>অন্যান্য</option>
</select>
<input id="r-date" type="date">
<input id="r-place" placeholder="হাসপাতাল / ক্লিনিক">
<textarea id="r-note" placeholder="নোট"></textarea>
<button onclick="addRecord()">যোগ করুন</button>
</div>
<h2 style="margin:12px 4px">📁 আমার রেকর্ড</h2>
<div id="records-list"></div>
</div>

<div id="tab-reminders" class="hidden">
<div class="card">
<h2>⏰ অনুস্মারক</h2>
<input id="rem-title" placeholder="শিরোনাম">
<input id="rem-date" type="datetime-local">
<button onclick="addReminder()">যোগ করুন</button>
</div>
<div id="reminders-list"></div>
</div>

<div id="tab-share" class="hidden">
<div class="card">
<h2>🤝 শেয়ার</h2>
<p style="font-size:13px">শীঘ্রই আসছে।</p>
</div>
</div>

</div>

<div class="tabbar">
<button id="btn-profile" onclick="tab('profile')" class="active">প্রোফাইল</button>
<button id="btn-records" onclick="tab('records')">রেকর্ড</button>
<button id="btn-reminders" onclick="tab('reminders')">অনুস্মারক</button>
<button id="btn-share" onclick="tab('share')">শেয়ার</button>
</div>

<script>
var profile={},records=[],reminders=[];
try{
profile=JSON.parse(localStorage.getItem('profile')||'{}');
records=JSON.parse(localStorage.getItem('records')||'[]');
reminders=JSON.parse(localStorage.getItem('reminders')||'[]');
}catch(e){}

function save(){
localStorage.setItem('profile',JSON.stringify(profile));
localStorage.setItem('records',JSON.stringify(records));
localStorage.setItem('reminders',JSON.stringify(reminders));
}

function tab(t){
['profile','records','reminders','share'].forEach(function(x){
document.getElementById('tab-'+x).classList.add('hidden');
document.getElementById('btn-'+x).classList.remove('active');
});
document.getElementById('tab-'+t).classList.remove('hidden');
document.getElementById('btn-'+t).classList.add('active');
if(t==='records')renderRecords();
if(t==='reminders')renderReminders();
}

function saveProfile(){
profile={
name:document.getElementById('p-name').value,
phone:document.getElementById('p-phone').value,
age:document.getElementById('p-age').value,
gender:document.getElementById('p-gender').value
};
save();
document.getElementById('status').textContent='✅ সংরক্ষিত';
}

function addRecord(){
var t=document.getElementById('r-type').value;
var d=document.getElementById('r-date').value;
var p=document.getElementById('r-place').value;
var n=document.getElementById('r-note').value;
if(!d){alert('তারিখ দিন');return}
records.push({id:Date.now(),type:t,date:d,place:p,note:n});
save();renderRecords();
document.getElementById('r-date').value='';
document.getElementById('r-place').value='';
document.getElementById('r-note').value='';
alert('✅ যোগ হয়েছে');
}

function renderRecords(){
var list=document.getElementById('records-list');
if(records.length===0){
list.innerHTML='<p style="text-align:center;color:#a0aec0">কোনো রেকর্ড নেই</p>';
return;
}
var h='';
records.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(r){
h+='<div class="rec"><b>'+r.type+'</b> — '+r.date;
if(r.place)h+=' | 🏥 '+r.place;
if(r.note)h+='<br>'+r.note;
h+='<br><button style="background:#e53e3e;padding:4px;font-size:12px;width:auto;margin-top:6px" onclick="del('+r.id+')">🗑️ মুছুন</button></div>';
});
list.innerHTML=h;
}

function del(id){
if(!confirm('মুছবেন?'))return;
records=records.filter(function(r){return r.id!==id});
save();renderRecords();
}

function addReminder(){
var t=document.getElementById('rem-title').value;
var d=document.getElementById('rem-date').value;
if(!t||!d){alert('সব দিন');return}
reminders.push({id:Date.now(),title:t,date:d,notified:false});
save();renderReminders();
document.getElementById('rem-title').value='';
document.getElementById('rem-date').value='';
alert('⏰ অনুস্মারক যোগ হয়েছে');
}

function renderReminders(){
var list=document.getElementById('reminders-list');
if(reminders.length===0){
list.innerHTML='<p style="text-align:center;color:#a0aec0">কোনো অনুস্মারক নেই</p>';
return;
}
var h='';
reminders.slice().sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(r){
h+='<div class="rec"><b>'+r.title+'</b><br>🕒 '+new Date(r.date).toLocaleString('bn-BD')+'<br><button style="background:#e53e3e;padding:4px;font-size:12px;width:auto;margin-top:6px" onclick="delRem('+r.id+')">🗑️ মুছুন</button></div>';
});
list.innerHTML=h;
}

function delRem(id){
if(!confirm('মুছবেন?'))return;
reminders=reminders.filter(function(r){return r.id!==id});
save();renderReminders();
}

function checkReminders(){
var now=new Date().getTime();
reminders.forEach(function(r){
var t=new Date(r.date).getTime();
if(!r.notified && t<=now && t>now-60000){
r.notified=true;
save();
var msg='⏰ অনুস্মারক: '+r.title;
if('Notification' in window && Notification.permission==='granted'){
new Notification('🩺 স্বাস্থ্য রিপোর্ট',{body:msg,icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>'});
}
alert(msg);
}
});
}

function askNotify(){
if('Notification' in window && Notification.permission==='default'){
Notification.requestPermission();
}
}
askNotify();
setInterval(checkReminders,30000);

document.getElementById('p-name').value=profile.name||'';
document.getElementById('p-phone').value=profile.phone||'';
document.getElementById('p-age').value=profile.age||'';
document.getElementById('p-gender').value=profile.gender||'';
</script>
</body>
</html>
